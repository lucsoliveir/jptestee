<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Admin...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #08080a;
            color: #f2f1ec;
            font-family: 'Inter', sans-serif;
        }
        .redirecting {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(199,154,91,0.3);
            border-top: 4px solid #c79a5b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirecting">
        <div class="spinner"></div>
        <p>Redirecting to FitConsult Admin Panel...</p>
        <p>If not redirected automatically, <a href="login.html">click here</a></p>
    </div>
    <script>
        // Redirect to login after 1.5 seconds
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    </script>
</body>
</html>
